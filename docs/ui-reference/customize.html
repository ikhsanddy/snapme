Frame

<button onClick="{{tabEfek}}" aria-pressed="{{isEfek}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; background: {{tabEfekBg}}; color: {{tabEfekFg}}; border: 2px solid #141414; border-radius: 999px; font-weight: 700; font-size: 15px">

Stiker

<span style="flex: 1; background: #F4F1E6; border-radius: 3px"></span>
<span style="flex: 1; background: #F4F1E6; border-radius: 3px"></span>
<span style="flex: 1; background: #F4F1E6; border-radius: 3px"></span>
<sc-if value="{{f.on}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; top: -10px; right: -10px; display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; background: #5038D6; color: #FFFDF7; border: 2px solid #141414; border-radius: 999px">

</span>
</sc-if>
</button>
<span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 12px">{{f.name}}</span>
</div>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{isEfek}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em">Efek foto</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{effects}}" as="e" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: 6px; align-items: center">
<button onClick="{{e.pick}}" aria-pressed="{{e.on}}" aria-label="{{e.label}}" style="width: 100%; aspect-ratio: 1 / 1; box-sizing: border-box; padding: 0; background: #FFFDF7; border: 2px solid #141414; border-radius: 10px; box-shadow: {{e.ring}}; overflow: hidden; display: flex">
<span style="flex: 1; background: linear-gradient(135deg, #F2479B 0%, #F2479B 50%, #C3F53C 50%, #C3F53C 100%); filter: {{e.fx}}"></span>
</button>
<span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 12px">{{e.name}}</span>
</div>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{isStiker}}" hint-placeholder-val="{{false}}">

<svg viewBox="0 0 256 256" width="34" height="34" fill="currentColor" aria-hidden="true"><path d="{{s.d}}"></path></svg>
</button>
</sc-for>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.4; color: #5E5E57">Ketuk untuk menempel atau melepas. Di aplikasi asli, stiker bisa digeser, diputar, dan diubah ukurannya.</p>
</div>

Foto {{p.n}}

<svg viewBox="0 0 256 256" width="28" height="28" fill="currentColor" aria-hidden="true"><path d="{{s.d}}"></path></svg>
</span>
</sc-for>
</div>
</div>
<p style="margin: 0; font-family: 'Space Mono', monospace; font-size: 12px; color: #5E5E57; text-align: center">Ekspor 600 x 1800 px (2 x 6 inci, 300 dpi)</p>

<aside style="flex: 1 1 250px; display: flex; flex-direction: column; gap: 16px">

<h2 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 16px">Strip Hidup</h2>
<button onClick="{{toggleLive}}" aria-pressed="{{live}}" aria-label="Strip Hidup" style="flex-shrink: 0; width: 56px; height: 32px; box-sizing: border-box; padding: 2px; background: {{liveBg}}; border: 2px solid #141414; border-radius: 999px; display: flex; justify-content: {{liveJustify}}">
<span style="width: 24px; height: 24px; box-sizing: border-box; background: #FFFDF7; border: 2px solid #141414; border-radius: 999px"></span>
</button>

<span style="width: 24px; height: 24px; box-sizing: border-box; background: #FFFDF7; border: 2px solid #141414; border-radius: 999px"></span>

</div>

</div>

/* Mesin templat kecil untuk halaman acuan ini saja (bukan kode produk).

function lookup(path, scope) {
