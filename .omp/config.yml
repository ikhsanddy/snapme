# Konfigurasi omp khusus proyek snapme.
#
# - Hanya terbaca bila `omp` dijalankan dari folder ini (root repo). omp tidak
#   mencari .omp/ di folder induk.
# - Prioritas: default bawaan < ~/.omp/agent/config.yml (global) < FILE INI
#   < --config <file> < flag CLI dan env var (--model, --smol, --slow, --plan,
#   PI_SMOL_MODEL, PI_SLOW_MODEL, PI_PLAN_MODEL).
# - Mapping digabung per key; array diganti seluruhnya (bukan ditambahkan).
# - Cek nilai efektif dari root repo:  omp config get modelRoles
# - File ini tidak boleh berisi API key atau token.

# ── Skill ────────────────────────────────────────────────────────────────────
# find-skills dan taste-skill dipasang ke .agents/skills/ (ARCHITECTURE §11.3).
# Nilai di bawah sama dengan default omp; ditulis supaya config global yang
# mematikannya tidak ikut berlaku di proyek ini.
skills:
  enabled: true
  enableSkillCommands: true # /skill:find-skills, /skill:design-taste-frontend
  enableAgentsProject: true # membaca .agents/skills/

# ── Pagar perintah shell ─────────────────────────────────────────────────────
# Menegakkan "Batas aman" di AGENTS.md. Mode approval (default omp: yolo) tidak
# diubah di sini. Aturan dicek berurutan, yang pertama cocok menang; `*` adalah
# wildcard. deny = selalu ditolak, prompt = minta persetujuan (di subagent dan
# mode headless, prompt berarti ditolak).
# Daftar ini MENGGANTIKAN bash.patterns di config global selama berada di
# proyek ini. Ini kebijakan persetujuan, bukan sandbox.
bash:
  patterns:
    - match: "git push*--force*"
      approval: deny
    - match: "git push* -f*"
      approval: deny
    - match: "rm -rf /*"
      approval: deny
    - match: "rm -rf ~*"
      approval: deny
    - match: "git push*"
      approval: prompt
    - match: "git commit*"
      approval: prompt
    - match: "git reset --hard*"
      approval: prompt
    - match: "git clean*"
      approval: prompt
    # Memasang skill selalu lewat persetujuan pengguna (AGENTS.md aturan 3).
    - match: "*skills add*"
      approval: prompt
    # Perintah yang mengubah proyek Supabase atau men-deploy ke Vercel.
    - match: "*supabase db reset*"
      approval: prompt
    - match: "*supabase db push*"
      approval: prompt
    - match: "*supabase*delete*"
      approval: prompt
    - match: "*vercel*--prod*"
      approval: prompt
    - match: "*vercel deploy*"
      approval: prompt
    - match: "*vercel env*"
      approval: prompt
